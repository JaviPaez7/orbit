packages:
  - 'apps/*'
  - 'packages/*'

# pnpm >=10 blocks postinstall scripts by default. These are required:
#   prisma/@prisma/*      -> query engine binaries
#   esbuild               -> vite + tsx bundling
#   playwright            -> browser download for E2E tests
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  prisma: true
  esbuild: true
  playwright: true
  playwright-core: true
  better-sqlite3: set this to true or false
