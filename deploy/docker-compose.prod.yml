# ---------------------------------------------------------------------------
# Orbit — production stack for the Hetzner VPS.
#
# Follows the conventions already used by the other apps on this host:
#   * joined to the shared `public-edge` network so Traefik routes to it
#   * routed by Host rule with the `lehttp` (Let's Encrypt, HTTP-01) resolver:
#     the shared `le` DNS-01 resolver failed LE's secondary validation for this
#     host (networking error looking up TXT/CAA at Cloudflare), HTTP-01 does not
#   * PostgreSQL 16 in its own container, not published to the host
#
# Deploy:  bash scripts/deploy-vps.sh   (see the README → Deployment)
# ---------------------------------------------------------------------------

services:
  db:
    image: postgres:16-alpine
    container_name: orbit-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-orbit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-orbit}
    volumes:
      - orbit-pgdata:/var/lib/postgresql/data
    networks:
      - orbit-internal
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-orbit} -d ${POSTGRES_DB:-orbit}']
      interval: 10s
      timeout: 5s
      retries: 12
    # The database is reachable only from the app network.
    expose:
      - '5432'

  api:
    build:
      # The compose file lives in deploy/, but the image needs the repository
      # root as its context (workspace manifests, apps/, packages/).
      context: ..
      dockerfile: deploy/Dockerfile.api
    image: orbit-api:latest
    container_name: orbit-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: '4000'
      APP_URL: https://${ORBIT_DOMAIN:?ORBIT_DOMAIN is required}
      DATABASE_URL: postgresql://${POSTGRES_USER:-orbit}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-orbit}?schema=public
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET is required}
      SESSION_TTL_DAYS: '30'
      RESET_TOKEN_TTL_MINUTES: '60'
      CORS_ORIGINS: https://${ORBIT_DOMAIN}
      UPLOAD_DIR: uploads
      EXPOSE_RESET_TOKEN: 'false'
      # Traffic reaches the app through Traefik over HTTPS.
      COOKIE_SECURE: 'true'
      LOG_LEVEL: info
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
    volumes:
      - orbit-uploads:/app/apps/server/uploads
    networks:
      - orbit-internal
      - public-edge
    labels:
      traefik.enable: 'true'
      traefik.docker.network: public-edge
      traefik.http.routers.orbit.entrypoints: websecure
      # A single rule value: `/api` plus its sub-paths, so the API router owns
      # every API route on this host. The router is one route in viaduct.
      traefik.http.routers.orbit.rule: Host(`${ORBIT_DOMAIN}`) && PathPrefix(`/api`)
      traefik.http.routers.orbit.tls.certresolver: lehttp
      traefik.http.routers.orbit.priority: '100'
      traefik.http.services.orbit.loadbalancer.server.port: '4000'
      traefik.http.services.orbit.loadbalancer.server.scheme: http

  # The built SPA is published as a static volume and served by a tiny server on
  # the same edge network, so no reverse-proxy config file is needed.
  web:
    image: nginx:1.27-alpine
    container_name: orbit-web
    restart: unless-stopped
    depends_on:
      - api
    volumes:
      - ./web-dist:/usr/share/nginx/html:ro
      - ./nginx-spa.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - orbit-internal
      - public-edge
    labels:
      traefik.enable: 'true'
      traefik.docker.network: public-edge
      # Everything else on this host goes to the SPA. `/api` is excluded here so
      # the two routers can never overlap, regardless of rule-priority maths.
      traefik.http.routers.orbit-web.entrypoints: websecure
      traefik.http.routers.orbit-web.rule: Host(`${ORBIT_DOMAIN}`) && !PathPrefix(`/api`)
      traefik.http.routers.orbit-web.tls.certresolver: lehttp
      traefik.http.routers.orbit-web.priority: '10'
      traefik.http.services.orbit-web.loadbalancer.server.port: '80'

volumes:
  orbit-pgdata:
  orbit-uploads:

networks:
  orbit-internal:
    name: orbit-internal
  # Created by the existing Traefik stack; declared external so we join it.
  public-edge:
    external: true
    name: public-edge
