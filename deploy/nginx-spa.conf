# nginx config for the Orbit SPA container.
#
# The SPA alone is static, so the real API lives in a separate container and is
# routed by Traefik. This file only has to serve files and support client-side
# routing (deep links like /issues/OLX-123 must return index.html).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Hashed build assets are immutable; index.html must never be cached, or a
    # deploy would keep serving the previous bundle.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    location = /health {
        access_log off;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
