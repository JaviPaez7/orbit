# ---------------------------------------------------------------------------
# Orbit — nginx site configuration (single origin: static client + API proxy).
#
# Install as /etc/nginx/sites-available/orbit and symlink into sites-enabled.
# Replace orbit.example.com with your domain, then run `certbot --nginx`.
#
# Serving both from one origin means the session cookie is same-site and CORS is
# never exercised in production; the WebSocket upgrade is proxied explicitly.
# ---------------------------------------------------------------------------

upstream orbit_api {
    # Keep in sync with PORT in /opt/orbit/apps/server/.env
    server 127.0.0.1:4000;
    keepalive 32;
}

# Redirect HTTP to HTTPS once certbot has issued the certificate. Before that,
# comment this block out (or use `certbot --nginx` which rewrites it for you).
server {
    listen 80;
    listen [::]:80;
    server_name orbit.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name orbit.example.com;

    # Managed by certbot:
    # ssl_certificate     /etc/letsencrypt/live/orbit.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/orbit.example.com/privkey.pem;
    # include             /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # --- security headers ---------------------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 6m;   # matches the API's 5MB upload limit + overhead

    # --- static client -------------------------------------------------------
    root /opt/orbit/apps/web/dist;
    index index.html;

    # Hashed assets are immutable; index.html must never be cached.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    # --- API ----------------------------------------------------------------
    location /api/ {
        proxy_pass http://orbit_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }

    # --- realtime WebSocket -------------------------------------------------
    location /api/realtime {
        proxy_pass http://orbit_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Long-lived connections: do not time out an idle socket.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # --- uploaded avatars / attachments -------------------------------------
    location /uploads/ {
        proxy_pass http://orbit_api;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public";
    }

    # --- SPA fallback (must stay last) --------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }
}
